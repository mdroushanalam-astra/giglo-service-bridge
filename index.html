<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Giglo - India's Hyperlocal Gig Marketplace | Investor Pitch Deck</title>
    <meta name="title" content="Giglo - India's Hyperlocal Gig Marketplace | Investor Pitch Deck" />
    <meta name="description" content="Giglo is formalizing 450M informal workers in India through a hyperlocal gig marketplace. Real-time matching, AI skill badges, zero middlemen. Pre-seed funding opportunity." />
    <meta name="keywords" content="Giglo, gig economy, India, informal workers, home services, hyperlocal, marketplace, startup, investment, pre-seed" />
    <meta name="author" content="Giglo" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://giglo.in/" />
    <meta property="og:title" content="Giglo - India's Hyperlocal Gig Marketplace" />
    <meta property="og:description" content="Formalizing 450M informal workers. Real-time matching, AI skill badges, zero middlemen. Join us in building the infrastructure that empowers India's workforce." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Giglo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://giglo.in/" />
    <meta name="twitter:title" content="Giglo - India's Hyperlocal Gig Marketplace" />
    <meta name="twitter:description" content="Formalizing 450M informal workers. Real-time matching, AI skill badges, zero middlemen. Join us in building the infrastructure that empowers India's workforce." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://giglo.in/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#F5A623" />
    <meta name="msapplication-TileColor" content="#F5A623" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Giglo",
      "url": "https://giglo.in",
      "logo": "https://giglo.in/giglo-logo.png",
      "description": "India's Hyperlocal Gig Marketplace - Formalizing 450M informal workers",
      "foundingDate": "2024",
      "founders": [
        {
          "@type": "Person",
          "name": "Md. Roushan Alam",
          "jobTitle": "CEO & Co-Founder"
        },
        {
          "@type": "Person",
          "name": "Ariba Irfan",
          "jobTitle": "Co-Founder & CSO"
        }
      ],
      "sameAs": [
        "https://www.linkedin.com/in/mdroushanalam",
        "https://www.linkedin.com/in/ariba-irfan-483254374"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@giglo.in",
        "contactType": "customer service"
      }
    }
    </script>

    <!-- Structured Data - WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Giglo Investor Pitch Deck",
      "description": "Interactive animated pitch deck for Giglo - India's Hyperlocal Gig Marketplace",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
